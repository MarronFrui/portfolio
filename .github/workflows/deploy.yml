name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Refresh the contribution calendar once a week even when nothing is
  # pushed: Monday 05:00 UTC (06:00 or 07:00 in Paris, depending on DST).
  # GitHub disables scheduled workflows after 60 days of repo inactivity;
  # the weekly cron itself does not count as activity.
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bake the GitHub contribution calendar into src/data/contributions.json
      # before the build, so the site never calls the API at page load. The
      # script exits non-zero on failure; the committed snapshot is kept then.
      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/fetch-contributions.mjs || echo "::warning::Kept the committed contributions.json"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
